<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>English for Future Teachers</title>
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/app.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="#/">
      <div class="brand-icon">
          <i data-lucide="graduation-cap"></i>
      </div>

    <div class="brand-info">
      <strong>English for Future Teachers</strong>
      <span>Interactive English Learning</span>
    </div>
  </a>
  <button id="about-author-trigger" class="about-author-trigger" type="button" aria-haspopup="dialog" aria-controls="about-author-dialog">Об авторе</button>
</header>

<main id="app" class="container" tabindex="-1"></main>

<footer class="footer">
  <span>English for Future Teachers</span>
  <span>Educational Learning Resource · 2026</span>
</footer>
<script>
    window.addEventListener('load', () => {
        if (window.lucide) {
            lucide.createIcons();
        }
    });
</script>
<dialog id="about-author-dialog" class="about-author-dialog" aria-labelledby="about-author-title">
  <button type="button" id="about-author-close" class="about-author-close" aria-label="Закрыть">×</button>
  <h2 id="about-author-title">Об авторе</h2>
  <p class="about-author-name">Чашина Альмира Финарисовна</p>
  <p class="about-author-role">Преподаватель английского языка</p>
  <p class="about-author-role">Заведующий кафедрой иностранных языков</p>
  <p class="about-author-college">ГБПОУ "Челябинский педагогический колледж №1"</p>
</dialog>
</body>
</html>
